<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cloudflare.com" />

    <!-- Title app -->
    <title>Scheduler - App</title>
  </head>

  <!-- Body tag -->
  <body class="bg-black w-full h-sceen">
    <!-- Navbar section -->
    <header class="w-full flex">
      <nav></nav>
    </header>

    <!-- Create and sorting section -->
    <section class="flex"></section>

    <!-- Main section that contains all schedule that we have created -->
    <main class="p-4 flex gap-4">
      <!-- Card component -->
      <article
        class="max-w-sm rounded-md bg-[#1e1f20] border border-[#e3e3e3]/10 text-[#e3e3e3]"
      >
        <header
          class="flex justify-between items-center p-4 border-b border-[#e3e3e3]/10 font-semibold"
        >
          <p
            class="border border-green-600 rounded-full text-green-600 bg-green-200 px-4 py-1"
          >
            Study
          </p>
          <p>120 Minutes</p>
        </header>
        <div class="p-4 border-b border-[#e3e3e3]/10">
          <p>
            Pastikan kelembapan tanah di blok A di atas 60% sebelum menyalakan
            irigasi.
          </p>
        </div>
        <footer class="p-4 flex justify-between items-center">
          <p class="text-sm opacity-40">03 April 2026</p>

          <div class="flex gap-2">
            <!-- Button delete -->
            <button
              class="p-2 border border-red-600 rounded-full text-red-600 bg-red-200 text-sm"
            ></button>

            <!-- Button update -->
            <button
              class="p-2 border border-blue-600 rounded-full text-blue-600 bg-blue-200 text-sm"
            ></button>

            <!-- Button markdown -->
            <button
              class="p-2 border border-green-600 rounded-full text-green-600 bg-green-200 text-sm"
            ></button>
          </div>
        </footer>
      </article>

      <article
        class="max-w-sm rounded-md bg-[#1e1f20] border border-[#e3e3e3]/10 text-[#e3e3e3]"
      >
        <header
          class="flex justify-between items-center p-4 border-b border-[#e3e3e3]/10 font-semibold"
        >
          <p
            class="border border-green-600 rounded-full text-green-600 bg-green-200 px-4 py-1"
          >
            Study
          </p>
          <p>120 Minutes</p>
        </header>
        <div class="p-4 border-b border-[#e3e3e3]/10">
          <p>
            Pastikan kelembapan tanah di blok A di atas 60% sebelum menyalakan
            irigasi.
          </p>
        </div>
        <footer class="p-4 flex justify-between items-center">
          <p class="text-sm opacity-40">03 April 2026</p>

          <div class="flex gap-2">
            <!-- Button delete -->
            <button
              class="p-2 border border-red-600 rounded-full text-red-600 bg-red-200 text-sm"
            ></button>

            <!-- Button update -->
            <button
              class="p-2 border border-blue-600 rounded-full text-blue-600 bg-blue-200 text-sm"
            ></button>

            <!-- Button markdown -->
            <button
              class="p-2 border border-green-600 rounded-full text-green-600 bg-green-200 text-sm"
            ></button>
          </div>
        </footer>
      </article>
    </main>

    <!-- Footer for copy right -->
    <footer></footer>
  </body>

  <!-- Todo connect file js externally -->
  <script src="main.js"></script>
</html>

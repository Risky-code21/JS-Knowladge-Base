<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dist/main.css" />

    <!-- Title app -->
    <title>Scheduler - App</title>
  </head>

  <!-- Body tag -->
  <body class="w-full flex flex-col min-h-screen">
    <!-- Header section -->
    <!-- Sudah di semantican dan diberikan attribut pendukung untuk aksesibilitas ✅ -->
    <header
      class="w-full max-w-[1440px] mx-auto flex flex-row items-center gap-4 md:gap-0 py-4 px-4 sm:px-12 md:px-20"
    >
      <!-- Logo smart scheduler -->
      <div class="flex place-items-center gap-4">
        <!-- Logo -->
        <div class="card-container p-3 text-blue-400">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-5"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M7.502 6h7.128A3.375 3.375 0 0 1 18 9.375v9.375a3 3 0 0 0 3-3V6.108c0-1.505-1.125-2.811-2.664-2.94a48.972 48.972 0 0 0-.673-.05A3 3 0 0 0 15 1.5h-1.5a3 3 0 0 0-2.663 1.618c-.225.015-.45.032-.673.05C8.662 3.295 7.554 4.542 7.502 6ZM13.5 3A1.5 1.5 0 0 0 12 4.5h4.5A1.5 1.5 0 0 0 15 3h-1.5Z"
              clip-rule="evenodd"
            />
            <path
              fill-rule="evenodd"
              d="M3 9.375C3 8.339 3.84 7.5 4.875 7.5h9.75c1.036 0 1.875.84 1.875 1.875v11.25c0 1.035-.84 1.875-1.875 1.875h-9.75A1.875 1.875 0 0 1 3 20.625V9.375ZM6 12a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75H6.75a.75.75 0 0 1-.75-.75V12Zm2.25 0a.75.75 0 0 1 .75-.75h3.75a.75.75 0 0 1 0 1.5H9a.75.75 0 0 1-.75-.75ZM6 15a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75H6.75a.75.75 0 0 1-.75-.75V15Zm2.25 0a.75.75 0 0 1 .75-.75h3.75a.75.75 0 0 1 0 1.5H9a.75.75 0 0 1-.75-.75ZM6 18a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75H6.75a.75.75 0 0 1-.75-.75V18Zm2.25 0a.75.75 0 0 1 .75-.75h3.75a.75.75 0 0 1 0 1.5H9a.75.75 0 0 1-.75-.75Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <!-- App name -->
        <h1 class="text-lg text-heading font-semibold">Smart scheduler</h1>
      </div>

      <!-- Reminding time in a day -->
      <div
        class="card-container hidden flex-row place-items-center gap-2 p-4 rounded-lg font-semibold"
      >
        <!-- Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-4"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z"
            clip-rule="evenodd"
          />
        </svg>

        <!-- Reminding time -->
        <span id="reminder-time" aria-label="reminding time"
          >1 Hour 20 Minutes</span
        >
      </div>
    </header>

    <!-- Stats section -->
    <article
      class="grid grid-cols-3 md:grid-cols-5 gap-4 w-full mx-auto max-w-[1440px] py-2 px-4 sm:px-12 md:px-20"
    >
      <!-- Circle diagaram and time stats -->
      <div
        class="neumorph-raised gap-4 p-6 rounded-2xl col-span-full md:col-span-2 flex flex-row items-center justify-between"
      >
        <!-- Stats information -->
        <div class="flex flex-col">
          <!-- Total waktu yang digunakan dalam sehari -->
          <h2
            class="text-6xl leading-none [text-shadow:0_0_15px_rgba(255,255,255,0.2),0_0_30px_rgba(255,255,255,0.1)]"
            id="time-used"
          ></h2>
          <p class="text-xl font-semibold text-heading mt-2">Minutes today</p>

          <!-- Waktu yang tersisa dari waktu keseluruhan -->
          <p id="time-reminding"></p>
        </div>

        <!-- Circle diagaram -->
        <svg
          width="200"
          height="200"
          viewBox="0 0 200 200"
          class="overflow-visible"
        >
          <defs>
            <filter
              id="inset-shadow"
              x="-50%"
              y="-50%"
              width="200%"
              height="200%"
              color-interpolation-filters="sRGB"
            >
              <feGaussianBlur stdDeviation="3" in="SourceAlpha" result="blur" />
              <feOffset dx="3" dy="3" in="blur" result="offsetBlur" />
              <feComposite
                operator="out"
                in="SourceAlpha"
                in2="offsetBlur"
                result="inverse"
              />
              <feFlood
                flood-color="#000000"
                flood-opacity="0.8"
                result="color"
              />
              <feComposite
                operator="in"
                in="color"
                in2="inverse"
                result="shadow"
              />
              <feComposite operator="over" in="shadow" in2="SourceGraphic" />
            </filter>

            <filter
              id="blue-glow"
              x="-50%"
              y="-50%"
              width="200%"
              height="200%"
              color-interpolation-filters="sRGB"
            >
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <circle
            cx="100"
            cy="100"
            r="75"
            fill="none"
            stroke="#1a1a1a"
            stroke-width="20"
          />

          <circle
            cx="100"
            cy="100"
            r="75"
            fill="none"
            stroke="#141414"
            stroke-width="20"
            filter="url(#inset-shadow)"
          />

          <circle
            id="progress-circle"
            cx="100"
            cy="100"
            r="75"
            fill="none"
            stroke="#3b82f6"
            stroke-width="14"
            stroke-linecap="round"
            filter="url(#blue-glow)"
            style="
              transition: stroke-dashoffset 0.8s ease-in-out;
              stroke-dasharray: 471.2;
              stroke-dashoffset: 471.2;
            "
            transform="rotate(-90 100 100)"
          />

          <text
            id="text"
            x="100"
            y="100"
            fill="white"
            font-weight="bold"
            font-size="24"
            text-anchor="middle"
            dominant-baseline="middle"
            font-family="sans-serif"
            class="[text-shadow:0_0_15px_rgba(255,255,255,0.2),0_0_30px_rgba(255,255,255,0.1)]"
          ></text>
        </svg>
      </div>

      <!-- Total schedules ✅ -->
      <div class="stats-box-primary" aria-label="stat total schedule">
        <!-- Icon container total schedules -->
        <div
          class="neumorph-raised w-fit rounded-full text-blue-400 p-4 hidden md:block"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6"
            aria-hidden="true"
          >
            <path
              d="M16.5 6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v7.5a3 3 0 0 0 3 3v-6A4.5 4.5 0 0 1 10.5 6h6Z"
            />
            <path
              d="M18 7.5a3 3 0 0 1 3 3V18a3 3 0 0 1-3 3h-7.5a3 3 0 0 1-3-3v-7.5a3 3 0 0 1 3-3H18Z"
            />
          </svg>
        </div>

        <!-- Stats info -->
        <div
          class="flex flex-col gap-2 items-center md:items-start"
          aria-label="stat information"
        >
          <!-- Stats calculation -->
          <h2
            class="text-4xl md:text-6xl text-blue-400 [text-shadow:0_0_10px_rgba(96,165,250,0.4),0_0_20px_rgba(96,165,250,0.2)] leading-none"
            id="stat-total-schedule"
          ></h2>
          <!-- Stats context -->
          <p class="text-base md:text-lg">Total</p>
        </div>
      </div>

      <!-- On progress schedules ✅ -->
      <div class="stats-box-primary" aria-label="stat progress schedule">
        <!-- Icon container total schedules -->
        <div
          class="neumorph-raised w-fit rounded-full text-orange-400 p-4 hidden md:block"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6"
            aria-hidden=" true"
          >
            <path
              fill-rule="evenodd"
              d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.176 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 0 1 1.925-3.546 3.75 3.75 0 0 1 3.255 3.718Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <!-- Stats info -->
        <div
          class="flex flex-col gap-2 items-center md:items-start"
          aria-label="stat information"
        >
          <!-- Stats calculation -->
          <h2
            class="text-4xl md:text-6xl text-orange-400 [text-shadow:0_0_10px_rgba(251,146,60,0.4),0_0_20px_rgba(251,146,60,0.2)] leading-none"
            id="stat-progress-schedule"
          ></h2>
          <!-- Stats context -->
          <p class="text-base md:text-lg">Progress</p>
        </div>
      </div>

      <!-- Done schedules ✅ -->
      <div class="stats-box-primary" aria-label="stat done schedule">
        <!-- Icon container total schedules -->
        <div
          class="neumorph-raised w-fit rounded-full text-green-400 p-4 hidden md:block"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M19.916 4.626a.75.75 0 0 1 .208 1.04l-9 13.5a.75.75 0 0 1-1.154.114l-6-6a.75.75 0 0 1 1.06-1.06l5.353 5.353 8.493-12.74a.75.75 0 0 1 1.04-.207Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <!-- Stats info -->
        <div
          class="flex flex-col gap-2 items-center md:items-start"
          aria-label="stat information"
        >
          <!-- Stats calculation -->
          <h2
            class="text-4xl md:text-6xl text-green-400 [text-shadow:0_0_10px_rgba(74,222,128,0.4),0_0_20px_rgba(74,222,128,0.2)] leading-none"
            id="stat-done-schedule"
          ></h2>
          <!-- Stats context -->
          <p class="text-base md:text-lg">Done</p>
        </div>
      </div>
    </article>

    <!-- Create and sorting section -->
    <nav
      id="container-primary-action"
      aria-label="control sistem to create, read, update, and delete"
      class="flex flex-col sm:flex-row gap-4 py-2 px-4 sm:px-12 md:px-20 font-semibold w-full max-w-[1440px] mx-auto"
    >
      <!-- Add new schedule -->
      <button class="btn-primary" id="btn-create-form-trigger" type="button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-4"
        >
          <path
            fill-rule="evenodd"
            d="M12 3.75a.75.75 0 0 1 .75.75v6.75h6.75a.75.75 0 0 1 0 1.5h-6.75v6.75a.75.75 0 0 1-1.5 0v-6.75H4.5a.75.75 0 0 1 0-1.5h6.75V4.5a.75.75 0 0 1 .75-.75Z"
            clip-rule="evenodd"
          />
        </svg>

        <span>Create</span>
      </button>

      <!-- Sorting schedule by time-->
      <div class="relative">
        <!-- Button yang digunakan untuk mentrigger dropdownsort dengan waktu  -->
        <button class="btn-primary" id="btn-sort-time-trigger" type="button">
          <!-- Sorting icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-4"
          >
            <path
              fill-rule="evenodd"
              d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z"
              clip-rule="evenodd"
            />
          </svg>

          <!-- label -->
          <span>Sort by time</span>
        </button>

        <!-- Dropdown untuk menampilkan aksi yang tersedia yang akan digunakan untuk dijadikan metode sort -->
        <div class="dropdown-container hidden" id="drop-down-time">
          <!-- Pengurutan waktu yang dilakukan dari urutan baru ke urutan terlama -->
          <button class="dropdown-option" data-sort-by-time="Newest">
            <!-- Label option -->
            <span>Descending</span>

            <!-- Circle status -->
            <div class="cicle-status"></div>
          </button>

          <!-- Pengurutan waktu yang dilakukan dari urutan lama ke urutan terbaru -->
          <button class="dropdown-option" data-sort-by-time="Oldest">
            <!-- Label option -->
            <span>Ascending</span>

            <!-- Circle status -->
            <div class="cicle-status"></div>
          </button>

          <!-- Divider sebagai pemisah opsi sort by dan opsi reset urutan ke default -->
          <div class="my-1 h-px w-full bg-white/[0.1] rounded-full"></div>

          <!-- Opsi reset untuk menampilkan semua jadwal dari urutan sebelumnya -->
          <button class="dropdown-option" data-sort-by-time="All">
            <!-- Label option -->
            <span>Reset option</span>

            <!-- Circle status -->
            <div class="cicle-status bg-red-400"></div>
          </button>
        </div>
      </div>

      <!-- Sorting schedule by time-->
      <div class="relative hidden">
        <button
          class="btn-primary"
          id="btn-sort-category-trigger"
          type="button"
        >
          <!-- Sorting icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-4"
          >
            <path
              d="M5.566 4.657A4.505 4.505 0 0 1 6.75 4.5h10.5c.41 0 .806.055 1.183.157A3 3 0 0 0 15.75 3h-7.5a3 3 0 0 0-2.684 1.657ZM2.25 12a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3v-6ZM5.25 7.5c-.41 0-.806.055-1.184.157A3 3 0 0 1 6.75 6h10.5a3 3 0 0 1 2.683 1.657A4.505 4.505 0 0 0 18.75 7.5H5.25Z"
            />
          </svg>

          <!-- label -->
          <span>Sort by category</span>
        </button>

        <div class="dropdown-container" id="dropdown-sort-category"></div>
      </div>
    </nav>

    <!-- Main section that contains all schedule that we have created -->
    <!-- Sudah di semantican dan diberikan attribut pendukung untuk aksesibilitas ✅ -->
    <main
      class="flex flex-col py-8 px-4 sm:px-12 md:px-20 gap-8 w-full max-w-[1440px] mx-auto"
    >
      <!-- Tabs bar -->
      <!-- Sudah semantic dan aria friendly ✅ -->
      <nav
        class="tabs-container"
        role="tablist"
        aria-label="Filter schedule by status"
      >
        <!-- Opsi semua jadwal -->
        <button
          class="z-20"
          role="tab"
          aria-selected="true"
          aria-controls="container-schedule"
          data-tabs-option="All"
        >
          All
        </button>

        <!-- Opsi on proggress jadwal -->
        <button
          class="z-20"
          role="tab"
          aria-selected="false"
          aria-controls="container-schedule"
          data-tabs-option="On progress"
        >
          On progress
        </button>

        <!-- Opsi done -->
        <button
          class="z-20"
          role="tab"
          aria-selected="false"
          aria-controls="container-schedule"
          data-tabs-option="Done"
        >
          Done
        </button>

        <!-- Indikator -->
        <div
          id="indicator-bar"
          class="z-0 absolute top-2 bottom-2 transition-all duration-500 rounded-xl bg-blue-600 shadow-[0_0_15px_rgba(37,99,235,0.4)] after:content-[''] after:absolute after:inset-0 after:rounded-xl after:shadow-[inset_2px_2px_4px_rgba(255,255,255,0.3),inset_-2px_-2px_4px_rgba(0,0,0,0.2)]"
        ></div>
      </nav>
      <!-- Section on progress -->
      <section
        class="gap-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 w-full transition-all duration-500 ease-in"
        aria-labelledby="list-heading"
        id="container-schedule"
      >
        <h2 id="list-heading" class="sr-only">List of schedule</h2>
      </section>
    </main>

    <!-- Footer for copy right -->
    <!-- Sudah di semantican dan diberikan attribut pendukung untuk aksesibilitas ✅ -->
    <footer class="bg-[#1e1f20] p-6 mt-auto text-center">
      <span>&copy; 2026 Smart scheduler. All right reserved.</span>
    </footer>

    <!-- Black screen -->
    <!-- Sudah di semantican dan diberikan attribut pendukung untuk aksesibilitas ✅ -->
    <!-- Pastikan elemen yang dibuat melalui fase creation external diberikan semantic tag juga ⚠️ -->
    <div
      id="black-overlay"
      class="fixed z-50 backdrop-blur-sm inset-0 min-h-full bg-black/60 flex justify-center items-end md:items-center md:px-2 transition-opacity duration-500 invisible opacity-0 hidden"
    >
      <!-- Container form -->
      <div
        class="form-container max-w-[516px] hidden"
        id="container-form-flexible"
      >
        <!-- Bar handler untuk swipe diperangkat mobile -->
        <div
          class="p-2 flex md:hidden handle-bar"
          aria-label="swipe bar to close bottom sheets"
        >
          <div class="w-12 h-2 bg-gray-600/50 rounded-full mx-auto mb-2"></div>
        </div>

        <!-- Header input -->
        <h2 class="text-2xl">Create your schedule</h2>

        <!-- Form create and update schedule -->
        <form class="flex flex-col gap-4" id="form-manipulation-flexible">
          <!-- Hidden input to swithc CRUD methode  -->
          <input id="scheduleId" name="scheduleId" type="hidden" value="" />

          <!-- Input form -->
          <!-- Title input -->
          <div class="flex flex-col gap-2">
            <!-- Label and inline validation -->
            <div class="flex justify-between items-center">
              <!-- Label input -->
              <label for="title">Title</label>

              <!-- Inline validation next to input -->
              <span
                id="error-title"
                class="text-red-400 font-semibold inline-flex gap-1.5 place-items-center error"
              ></span>
            </div>
            <!-- Main input -->
            <input
              id="title"
              type="text"
              name="title"
              value=""
              class="input-primary"
              placeholder="Insert schedule title"
            />
          </div>

          <!-- Time doing -->
          <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center">
              <!-- Label input -->
              <label for="title">Time doing</label>

              <!-- Inline validation input -->
              <span
                id="error-timeDoing"
                class="text-red-400 font-semibold inline-flex gap-1.5 place-items-center error"
              ></span>
            </div>
            <!-- Main input -->
            <input
              id="timeDoing"
              name="timeDoing"
              type="text"
              class="input-primary"
              placeholder="Insert time doing"
              value=""
            />
          </div>

          <!-- Category -->
          <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center">
              <!-- Label input -->
              <label for="title">Category</label>

              <!-- Inline validation input -->
              <span
                id="error-category"
                class="text-red-400 font-semibold inline-flex gap-1.5 place-items-center error"
              ></span>
            </div>
            <input
              id="category"
              name="category"
              type="text"
              class="input-primary"
              placeholder="Insert category schedule"
            />
          </div>

          <!-- Description input -->
          <div class="flex flex-col gap-2">
            <label for="description">Schedule description</label>
            <textarea
              id="description"
              name="description"
              class="input-primary"
              placeholder="Insert schedule description"
            ></textarea>
          </div>

          <!-- Button submit create-->
          <button
            type="submit"
            class="btn-primary ml-auto text-blue-400"
            id="create-button"
          >
            Create schedule
          </button>

          <!-- Button submit update -->
          <button
            type="submit"
            class="btn-primary ml-auto text-blue-400"
            id="update-button"
          >
            Update schedule
          </button>
        </form>
      </div>
    </div>
  </body>

  <!-- Todo connect file js externally -->
  <script type="module" src="main.js"></script>
</html>

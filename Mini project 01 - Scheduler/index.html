<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cloudflare.com" />

    <!-- Title app -->
    <title>Scheduler - App</title>
  </head>

  <!-- Body tag -->
  <body class="bg-[#0e0e0e] text-[#e3e3e3] w-full flex flex-col min-h-screen">
    <!-- Navbar section -->
    <header
      class="w-full max-w-[1440px] mx-auto flex flex-col md:flex-row md:justify-between gap-4 md:gap-0 py-8 px-4 sm:px-12 md:px-20"
    >
      <!-- Identity app -->
      <div class="flex gap-4 md:justify-center items-center">
        <!-- App name -->
        <h1 class="text-2xl font-semibold">
          <span class="text-blue-400"> Smart </span>
          scheduler
        </h1>
      </div>

      <!-- Remainding time -->
      <div
        class="py-2 px-4 flex gap-2 justify-center w-fit rounded-full bg-gradient-to-br from-orange-800 to-orange-400"
        aria-label="remainding time container"
        title="remanding time in a day"
        aria-hidden="true"
      >
        <!-- Icon schedule -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-6"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z"
            clip-rule="evenodd"
          />
        </svg>

        <p
          class="font-semibold"
          aria-label="remainding time in a day"
          id="reminder-time"
        ></p>
      </div>
    </header>

    <!-- Create and sorting section -->
    <nav
      id="container-primary-action"
      aria-label="control sistem to create, read, update, and delete"
      class="flex flex-col sm:flex-row gap-4 py-2 px-4 sm:px-12 md:px-20 font-semibold w-full max-w-[1440px] mx-auto"
    >
      <!-- Add new schedule -->
      <button
        class="flex justify-center items-center gap-2 bg-gradient-to-br from-blue-800 to-blue-400 px-4 py-2 rounded-md cursor-pointer"
        id="btn-create-form-trigger"
        type="button"
      >
        <!-- Plus icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-5"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M12 3.75a.75.75 0 0 1 .75.75v6.75h6.75a.75.75 0 0 1 0 1.5h-6.75v6.75a.75.75 0 0 1-1.5 0v-6.75H4.5a.75.75 0 0 1 0-1.5h6.75V4.5a.75.75 0 0 1 .75-.75Z"
            clip-rule="evenodd"
          />
        </svg>

        <!-- label -->
        <span>Create a schedule</span>
      </button>

      <!-- Sorting schedule -->
      <button
        class="flex justify-center items-center gap-2 bg-gradient-to-br from-red-800 to-red-400 px-4 py-2 rounded-md cursor-pointer"
        id="btn-sort-form-trigger"
        type="button"
      >
        <!-- Sorting icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-5"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M6.97 2.47a.75.75 0 0 1 1.06 0l4.5 4.5a.75.75 0 0 1-1.06 1.06L8.25 4.81V16.5a.75.75 0 0 1-1.5 0V4.81L3.53 8.03a.75.75 0 0 1-1.06-1.06l4.5-4.5Zm9.53 4.28a.75.75 0 0 1 .75.75v11.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-1.06 0l-4.5-4.5a.75.75 0 1 1 1.06-1.06l3.22 3.22V7.5a.75.75 0 0 1 .75-.75Z"
            clip-rule="evenodd"
          />
        </svg>

        <!-- label -->
        <span>Sort schedule by</span>
      </button>
    </nav>

    <!-- Main section that contains all schedule that we have created -->
    <!-- !! Section base on status -->
    <main
      class="flex flex-col md:flex-row py-8 px-4 sm:px-12 md:px-20 gap-6 w-full max-w-[1440px] mx-auto"
      aria-label="Wrapper from both section status of schedule"
    >
      <!-- Section on progress -->
      <section
        class="space-y-6 w-full md:w-1/2"
        aria-label="Section wrapper to wrap schedule with status on progress"
      >
        <!-- Header in every section -->
        <header class="flex gap-4">
          <!-- Container icon -->
          <span
            aria-hidden="true"
            class="p-2 flex w-fit rounded-full bg-gradient-to-br from-orange-800 to-orange-400"
          >
            <!-- Icon rocket -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-6"
            >
              <path
                fill-rule="evenodd"
                d="M9.315 7.584C12.195 3.883 16.695 1.5 21.75 1.5a.75.75 0 0 1 .75.75c0 5.056-2.383 9.555-6.084 12.436A6.75 6.75 0 0 1 9.75 22.5a.75.75 0 0 1-.75-.75v-4.131A15.838 15.838 0 0 1 6.382 15H2.25a.75.75 0 0 1-.75-.75 6.75 6.75 0 0 1 7.815-6.666ZM15 6.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z"
                clip-rule="evenodd"
              />
              <path
                d="M5.26 17.242a.75.75 0 1 0-.897-1.203 5.243 5.243 0 0 0-2.05 5.022.75.75 0 0 0 .625.627 5.243 5.243 0 0 0 5.022-2.051.75.75 0 1 0-1.202-.897 3.744 3.744 0 0 1-3.008 1.51c0-1.23.592-2.323 1.51-3.008Z"
              />
            </svg>
          </span>
          <!-- Title status -->
          <h2 class="text-2xl font-semibold">On progress</h2>
        </header>

        <!-- Schedule card -->
        <div class="space-y-6" id="container-schedule-on-progresss"></div>
      </section>

      <!-- Section done -->
      <section
        class="space-y-6 w-full md:w-1/2"
        aria-label="Section wrapper to wrap schedule with status done"
      >
        <!-- Header in every section -->
        <header class="flex gap-4">
          <!-- Container icon -->
          <span
            aria-hidden="true"
            class="p-2 flex w-fit rounded-full bg-gradient-to-br from-green-800 to-green-400"
          >
            <!-- Icon done -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-6"
            >
              <path
                fill-rule="evenodd"
                d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                clip-rule="evenodd"
              />
            </svg>
          </span>
          <!-- Title status -->
          <h2
            class="text-2xl font-semibold"
            aria-label="Title from section wrapper done"
          >
            Done
          </h2>
        </header>

        <!-- Schedule card -->
        <div
          class="space-y-6"
          id="container-schedule-done"
          aria-label="Container data schedule from section wrapper on progress"
        ></div>
      </section>
    </main>

    <!-- Footer for copy right -->
    <footer class="bg-[#1e1f20] p-6 mt-auto text-center">
      <p>&copy; 2026 Smart scheduler. All right reserved.</p>
    </footer>

    <!-- Black screen -->
    <div
      id="black-overlay"
      class="fixed backdrop-blur-sm inset-0 min-h-full bg-black/50 flex justify-center items-center px-4 sm:px-12 md:px-2 transition-all duration-200 invisible opacity-0"
    >
      <!-- Crud element -->
      <!-- Form create and update schedule -->
      <form
        class="bg-[#1e1f20] p-4 md:p-6 flex flex-col gap-4 rounded-md border border-[#e3e3e3]/10 w-full max-w-[516px] hidden"
        id="form-manipulation-flexible"
      >
        <!-- Header input -->
        <header class="space-y-2 mb-2">
          <h2 class="text-xl md:text-2xl lg:text-4xl font-semibold">
            Create your schedule
          </h2>
          <!-- <p class="text-sm md:text-base">
            Complete the information below to create your schedule.
          </p> -->
        </header>

        <!-- Hidden input to swithc CRUD methode  -->
        <input id="scheduleId" name="scheduleId" type="hidden" value="" />

        <!-- Input form -->
        <!-- Title input -->
        <div class="flex flex-col gap-2">
          <label for="title">Schedule title</label>
          <input
            id="title"
            type="text"
            name="title"
            class="p-3 rounded-md border border-[#e3e3e3]/10 transition-all duration-200 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400"
            placeholder="Insert schedule title"
            value=""
          />
          <div
            id="error-title"
            class="text-red-400 flex gap-2 items-center error"
          ></div>
        </div>

        <!-- Description input -->
        <div class="flex flex-col gap-2">
          <label for="description">Schedule description</label>
          <textarea
            id="description"
            name="description"
            class="p-3 rounded-md border border-[#e3e3e3]/10 resize-none min-h-36 transition-all duration-200 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400"
            placeholder="Insert schedule description"
            value=""
          ></textarea>
        </div>

        <!-- Time doing -->
        <div class="flex flex-col gap-2">
          <label for="timeDoing">Schedule time doing</label>
          <input
            id="timeDoing"
            name="timeDoing"
            type="text"
            class="p-3 rounded-md border border-[#e3e3e3]/10 transition-all duration-200 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400"
            placeholder="Insert schedule time doing in minutes range"
            value=""
          />
          <div
            id="error-timeDoing"
            class="text-red-400 flex gap-2 items-center error"
          ></div>
        </div>

        <!-- Category -->
        <div class="flex flex-col gap-2">
          <label for="category">Schedule category</label>
          <input
            id="category"
            name="category"
            type="text"
            class="p-3 rounded-md border border-[#e3e3e3]/10 transition-all duration-200 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400"
            placeholder="Insert unqiue schedule category"
            value=""
          />
        </div>

        <!-- Button submit create-->
        <button
          class="bg-gradient-to-br from-blue-800 to-blue-400 ml-auto py-2 px-4 rounded-md font-semibold"
          id="create-button"
        >
          <span>Create schedule</span>
        </button>

        <!-- Button submit update -->
        <button
          class="bg-gradient-to-br from-blue-800 to-blue-400 ml-auto py-2 px-4 rounded-md font-semibold hidden"
          id="update-button"
        >
          <span>Update schedule</span>
        </button>
      </form>
    </div>
  </body>

  <!-- Todo connect file js externally -->
  <script type="module" src="main.js"></script>
</html>
